# 09:35 WAT (UTC+1, no DST) == 08:35 UTC, Monday–Friday.
# Serverless attendance: spin up, send ONE message, exit.
name: "Attendance - Weekday Morning (09:35 WAT)"

on:
  schedule:
    - cron: "35 8 * * 1-5"
  workflow_dispatch: {} # allow manual runs from the Actions tab (for testing)

# Least privilege: this job only needs to read the repo.
permissions:
  contents: read

# Never let a manual run overlap a scheduled one; don't kill an in-flight send.
concurrency:
  group: attendance-weekday-morning
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # jitter can sleep up to MAX_JITTER_MINUTES
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        
      - name: Show schedule diagnostics
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled cron: ${{ github.event.schedule }}"
          echo "Commit: ${{ github.sha }}"
          echo "UTC time: $(date -u)"
          
      - name: Send attendance
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MAX_JITTER_MINUTES: "5"
        run: node src/run-once.js --profile=weekday-morning
